# 将当前系统采集的全部已完成 episode 合并成旧 dual_arm_teleop 可直接读取的
# LeRobot v3 数据集。该 profile 严格保留旧版 38D state / 24D action / 三路图像。
schema_version: 1

source:
  dataset_root: sessions/pick_place_demo
  episode: all
  manifest: ""
  mcap_files: []

output:
  root: sessions/pick_place_demo/lerobot_merged/dual_arm_lerobot_v1
  # profile exporter 按事件/无效行拆子 episode，lineage 保留父任务；独立 v2 文件保留 60Hz 全命令监督。
  episode_subdirectory: false
  repo_id: local/pick-place-demo-dual-arm-v1

lerobot_export:
  schema_version: 1
  profile: dual_arm_lerobot_v1
  timeline:
    source: camera/head/jpeg
    fps: 15.0
    resample: false
  action:
    view: sent_command
  high_rate_arm_samples_per_frame: 0
  depth:
    enabled: false
    cameras: []
  segments:
    gap_threshold_s: 0.25
    split_episodes: false
  channels: {}
