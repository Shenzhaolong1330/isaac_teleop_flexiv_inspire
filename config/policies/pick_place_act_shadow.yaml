record:
  repo_id: local/pick-place-demo-act-v1-shadow
  debug:
    robot_debug: true
  user_notes: Pick/place ACT v1 RPC shadow rollout
  fps: 15
  run_mode: run_policy
  reset_after_episode: false
  reset_on_finish: false
  disconnect_on_finish: true
  live_visualization:
    enabled: true
    update_hz: 2.0
    rgb_jpeg_quality: 80
    flush_timeout_s: 2.0
    depth_range_m: [0.15, 2.0]
    tactile_range: [0, 1000]

  robot_type: isaac_flexiv_rpc
  das_config_path: /home/hb/isaac_teleop_flexiv_inspire/config/policies/pick_place_rpc_robot.yaml

  policy:
    type: act
    config_path: /home/hb/isaac_teleop_flexiv_inspire/config/policies/pick_place_act_inference_policy.yaml
    pretrained_path: /home/hb/isaac_teleop_flexiv_inspire/artifacts/policies/pick_place_demo_act_v1/checkpoints/last/pretrained_model

  task:
    description: Pick up the target object and place it in the designated area.
    num_episodes: 10
    display: true
    resume: false
    resume_dataset: ""
    annotate_success: false

  time:
    episode_time_sec: 60
    reset_time_sec: 0
    save_meta_period: 1

  storage:
    push_to_hub: false
