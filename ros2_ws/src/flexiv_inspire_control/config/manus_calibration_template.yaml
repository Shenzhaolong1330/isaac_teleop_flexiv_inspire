# Isaac /xr_teleop/hand (50 PoseArray = left25 + right25) to Inspire
# RH56DFTP six-actuator calibration template.
#
# OpenXR has 26 joints per hand, but this ROS transport omits PALM (index 0)
# and carries WRIST..LITTLE_TIP (indices 1..25). Invalid joints arrive as zero
# poses. This file cannot command hardware until site measurements replace the
# endpoints/weights and `calibrated` is explicitly set to true.
schema_version: 1
calibrated: false
source_format: ISAAC_XR_HAND_POSEARRAY_LEFT25_RIGHT25
transport_joint_count_per_side: 25

channel_defaults: &finger_defaults
  bias: 0.0
  source_open: 0.0
  source_closed: 2.2
  output_open: 1000
  output_closed: 0

side_channels: &side_channels
  little:
    <<: *finger_defaults
    sources: [little_mcp_flexion, little_pip, little_dip]
    weights: [0.25, 0.45, 0.30]
  ring:
    <<: *finger_defaults
    sources: [ring_mcp_flexion, ring_pip, ring_dip]
    weights: [0.25, 0.45, 0.30]
  middle:
    <<: *finger_defaults
    sources: [middle_mcp_flexion, middle_pip, middle_dip]
    weights: [0.25, 0.45, 0.30]
  index:
    <<: *finger_defaults
    sources: [index_mcp_flexion, index_pip, index_dip]
    weights: [0.25, 0.45, 0.30]
  thumb_bend:
    bias: 0.0
    sources: [thumb_cmc_flexion, thumb_mcp, thumb_ip]
    weights: [0.35, 0.35, 0.30]
    source_open: 0.0
    source_closed: 1.7
    output_open: 1000
    output_closed: 0
  thumb_rotate:
    bias: 0.0
    sources: [thumb_cmc_abduction]
    weights: [1.0]
    source_open: -0.4
    source_closed: 0.9
    output_open: 1000
    output_closed: 0

sides:
  left:
    <<: *side_channels
  right:
    <<: *side_channels
