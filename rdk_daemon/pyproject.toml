[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiv-rdk-daemon"
version = "0.2.0"
description = "Independent, fail-closed Flexiv RDK 1.9 daemon"
requires-python = ">=3.10,<3.11"
dependencies = [
  "isaac-teleop-core==0.2.0",
  "flexivrdk==1.9.0",
  "numpy>=1.24,<2",
  "protobuf>=4.25,<6",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
flexiv-rdk-daemon = "flexiv_rdk_daemon.main:main"

flexiv-create-write-permit = "flexiv_rdk_daemon.create_write_permit:main"
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
