schema_version: 1

source:
  # Empty means recording.output_root/recording.dataset_name from site.yaml.
  dataset_root: ""
  episode: all
  manifest: ""
  mcap_files: []

output:
  format: rl100_zarr
  # Empty derives <dataset>/rl100/<profile>.zarr.
  root: ""
  episode_subdirectory: false

rl100_zarr_export:
  schema_version: 1
  profile: right_joint_proprio_cartesian_v1
  timeline:
    source: control/sent_command
    fps: 30.0
    # Teleop may run at 60 Hz; keep the policy dataset on a causal 30 Hz grid.
    resample: true
    max_period_error_fraction: 0.25
  action:
    view: sent_command
  camera_alignment: causal
  channels: {}
  segments:
    gap_threshold_s: 0.05
    min_frames: 9
    # Treat a released middle pedal as a recording pause inside the same task.
    stitch_gaps: true
