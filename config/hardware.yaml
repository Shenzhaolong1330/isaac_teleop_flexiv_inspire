session:
  id: flexiv-inspire-site
  runtime_root: /run/user/1000/isaac_teleop
  sessions_root: sessions

sampling:
  # 这些是写入数据集/发送命令的目标频率。
  # RGB、深度和点云作为同一原子帧统一按 15 Hz 采集和记录。
  arm_observation_hz: 300.0
  teleop_command_hz: 60.0
  hand_state_hz: 15.0
  tactile_hz: 15.0
  camera_hz: 15.0
  policy_observation_hz: 15.0
  training_timeline_hz: 15.0
  action_label: sent_command

pedal:
  # Input Remapper owns the raw PCsensor device and exposes left/space/right.
  device: "name:input-remapper keyboard"
  rerecord_key_code: 105
  enable_key_code: 57
  record_toggle_key_code: 106

flexiv:
  rdk_config: apps/flexiv_daemon/config/robots.yaml
  tool_payload_config: apps/flexiv_daemon/config/tool_payload.yaml
  frame_config: config/dual_arm_frames.yaml
  safety:
    # Practical site mode: trust the Flexiv controller's built-in joint,
    # speed, wrench and temperature protection. The bridge still rejects
    # disconnected/faulted robots and malformed/non-finite packets.
    software_safety_limits_enabled: false
    joint_lower_limits_rad: [-2.7925667762756348, -2.2689666748046875, -2.967066764831543, -1.8674668073654175, -2.967066764831543, -1.3962668180465698, -2.967066764831543]
    joint_upper_limits_rad: [2.7925667762756348, 2.2689666748046875, 2.967066764831543, 2.6877667903900146, 2.967066764831543, 4.537866592407227, 2.967066764831543]
    # Rizon4s reports a minimum per-joint dq_max of 2.094 rad/s. Keep a small
    # controller margin without tripping normal Cartesian teleop at 0.75 rad/s.
    max_joint_velocity_rad_s: 2.0
    max_tcp_linear_speed_m_s: 0.35
    max_tcp_angular_speed_rad_s: 1.0
    max_external_force_n: 60.0
    max_external_torque_nm: 8.0
    max_joint_temperature_c: 75.0
    hand_reference_tolerance: 1.0
    max_translation_step_m: 0.01
    max_rotation_step_rad: 0.10
    # Responsive teleoperation profile, still below the independent TCP safety
    # caps above (0.35 m/s and 1.0 rad/s).
    max_linear_velocity_m_s: 0.20
    max_angular_velocity_rad_s: 0.60
    max_linear_acceleration_m_s2: 1.0
    max_angular_acceleration_rad_s2: 2.0
  cartesian_control:
    mode: position
    position_stiffness: [3000, 3000, 3000, 200, 200, 200]
    impedance_stiffness: [1200, 1200, 1200, 80, 80, 80]
    damping_ratio: [0.7, 0.7, 0.7, 0.7, 0.7, 0.7]
  home:
    left_joints_rad: [0.0, 0.80, -1.80, -1.35, 0.8416, 0.30, -1.57]
    right_joints_rad: [0.0, -0.80, 1.80, 1.35, 2.30, 0.30, 0.0]
    max_velocity_rad_s: 0.50
    max_acceleration_rad_s2: 1.0
    tolerance_rad: 0.01
    timeout_s: 20.0
    quest_button: right_primary_click
    lift:
      # Confirmed TCP Z values from the mature dual_arm_teleop station setup.
      # This stage never descends: an arm already above its safe Z is skipped.
      enabled: true
      left_safe_z_m: -0.377676
      right_safe_z_m: -0.413296
      max_linear_velocity_m_s: 0.12
      max_angular_velocity_rad_s: 0.50
      max_linear_acceleration_m_s2: 0.50
      max_angular_acceleration_rad_s2: 1.0
      # 实用模式：抬升只是为了避开桌面，不需要为最后几厘米反复等待。
      tolerance_m: 0.03
      timeout_s: 15.0
      parallel: false

inspire:
  config: ros2_ws/src/flexiv_inspire_dftp/dual_hands.yaml
  left_host: 192.168.5.11
  right_host: 192.168.5.12
  port: 6000
  # Site installation is command-capable: teleop and the local Reset service
  # both write through this single DFTP driver.
  hardware_write_enabled: true
  reset:
    # Matches the proven connection check in the legacy dual_arm_teleop stack.
    enabled: true
    open_angle: 1000
    closed_angle: 0
    pause_s: 0.35
    command_timeout_s: 8.0
    # Reset succeeds only after all six measured angles on both hands are open.
    open_tolerance: 30
    open_timeout_s: 10.0
