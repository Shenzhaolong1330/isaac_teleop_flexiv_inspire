# This is the only site-editable runtime configuration.  Copy to config/site.yaml.
schema_version: 1
session:
  id: "flexiv-inspire-site"
  runtime_root: "/run/user/1000/isaac_teleop"
  sessions_root: "sessions"

# All rates are requested rates; the manifest stores achieved rate and drops.
sampling:
  arm_observation_hz: 200.0
  teleop_command_hz: 60.0
  hand_state_hz: 50.0
  tactile_hz: 30.0
  camera_hz: 30.0
  policy_observation_hz: 30.0
  training_timeline_hz: 30.0
  action_label: sent_command # the command accepted by hardware, never requested/safe alone

pedal:
  device: /dev/input/by-id/usb-PCsensor_FootSwitch-event-kbd
  # PCsensor keyboard mapping: left=105, down=108, right=106.
  rerecord_key_code: 105       # left arrow: atomically invalidate and start a new episode
  enable_key_code: 108         # down arrow: hold-to-enable; release latches hold
  record_toggle_key_code: 106  # right arrow: toggle recording, never robot motion

flexiv:
  rdk_config: apps/flexiv_daemon/config/robots.yaml
  tool_payload_config: apps/flexiv_daemon/config/tool_payload.yaml
  safety:
    # Rizon4s manufacturer defaults. Re-read RobotInfo from both controllers
    # during site commissioning and reject the hardware session on mismatch.
    # Degrees: [-160,-130,-170,-107,-170,-80,-170] and
    # [160,130,170,154,170,260,170].
    joint_lower_limits_rad: [-2.7925667762756348, -2.2689666748046875, -2.967066764831543, -1.8674668073654175, -2.967066764831543, -1.3962668180465698, -2.967066764831543]
    joint_upper_limits_rad: [2.7925667762756348, 2.2689666748046875, 2.967066764831543, 2.6877667903900146, 2.967066764831543, 4.537866592407227, 2.967066764831543]
    max_joint_velocity_rad_s: 0.75
    max_tcp_linear_speed_m_s: 0.35
    max_tcp_angular_speed_rad_s: 1.0
    max_external_force_n: 60.0
    max_external_torque_nm: 8.0
    max_joint_temperature_c: 75.0
    hand_reference_tolerance: 1.0
    max_translation_step_m: 0.01
    max_rotation_step_rad: 0.10
    max_linear_velocity_m_s: 0.05
    max_angular_velocity_rad_s: 0.15
    max_linear_acceleration_m_s2: 0.25
    max_angular_acceleration_rad_s2: 0.50
  cartesian_control:
    # Both choices use RDK NRT_CARTESIAN_MOTION_FORCE.  "position" uses high
    # configured stiffness; "impedance" sends the explicit stiffness/damping below.
    mode: position              # position | impedance
    position_stiffness: [3000, 3000, 3000, 200, 200, 200]
    impedance_stiffness: [1200, 1200, 1200, 80, 80, 80]
    damping: [60, 60, 60, 8, 8, 8]
  home:
    # Migrated values only from legacy dual_arm_teleop Flexiv config.  Automatic
    # connect/home behavior is deliberately not imported.
    left_joints_rad: [0.0, 0.80, -1.80, -1.35, 0.8416, 0.30, -1.57]
    right_joints_rad: [0.0, -0.80, 1.80, 1.35, 2.30, 0.30, 0.0]
    max_velocity_rad_s: 1.0
    max_acceleration_rad_s2: 2.0
    tolerance_rad: 0.01
    timeout_s: 20.0
    quest_button: right_primary_click # Quest right A key, rising edge

inspire:
  config: ros2_ws/src/flexiv_inspire_dftp/dual_hands.yaml
  left_host: 192.168.5.11
  right_host: 192.168.5.12
  port: 6000
  hardware_write_enabled: false

cameras:
  config: ros2_ws/src/flexiv_inspire_cameras/realsense_rgb.yaml
  recording_encoding: jpeg
  jpeg_quality: 90
  depth_enabled: false
  streams:
    head:        {serial: "346522072347", width: 424, height: 240, fps: 30, pixel_format: rgb8}
    left_wrist:  {serial: "342522074353", width: 424, height: 240, fps: 30, pixel_format: rgb8}
    right_wrist: {serial: "347622074577", width: 424, height: 240, fps: 30, pixel_format: rgb8}


# Quest video return is a display branch of the same CameraFrame messages that
# enter MCAP. Congestion drops XR display frames only; recording is unaffected.
xr_video:
  enabled: true
  auto_start_with_record: true
  ffmpeg: /usr/bin/ffmpeg
  encoder: auto               # auto: NVENC first, then libx264 fallback
  receiver_host: 127.0.0.1
  bitrate_mbps: 4.0
  keyframe_interval_frames: 15
  payload_type: 96            # required by IsaacTeleop camera receiver
  packet_size: 1200
  stream_timeout_s: 2.0
  streams:
    head:        {enabled: true, port: 5000}
    left_wrist:  {enabled: true, port: 5002}
    right_wrist: {enabled: true, port: 5003}
  display:
    mode: xr                   # xr | monitor
    cuda_device: 0
    head:        {distance: 1.5, width: 1.0, offset_x: 0.0, offset_y: 0.0}
    left_wrist:  {distance: 1.2, width: 0.4, offset_x: -1.0, offset_y: -0.4}
    right_wrist: {distance: 1.2, width: 0.4, offset_x: 1.0, offset_y: -0.4}
    lock_mode: lazy
    look_away_angle: 45.0
    reposition_distance: 0.5
    reposition_delay: 0.5
    transition_duration: 0.3

teleop:
  control_config: ros2_ws/src/flexiv_inspire_control/config/control_bridge.yaml
  teleop_config: ros2_ws/src/flexiv_inspire_control/config/teleop.yaml
  manus_calibration: ""
  control_enabled: false # always shadow at startup; local authorization is separate

lerobot_export:
  schema_version: 1
  timeline:
    source: camera/head/jpeg
    fps: 30.0
  action:
    # sent_command (30-D) | absolute_joint_position (14-D) | absolute_cartesian_pose (18-D)
    view: sent_command
  # canonical exporter stream -> recorded MCAP stream.  Use this to remap a
  # later hardware/topic layout without changing raw data or Python code.
  channels: {}

recording:
  camera_recording_mode: jpeg
  deviceio_mode: native
  # Immutable during an active episode.  Re-render/restart producers to change resolution/rate.
  snapshot_config: true

commands:
  # The unified launcher stays mock/shadow. Real hardware uses the staged
  # local RUNBOOK flow; never make this an implicit hardware-write path.
  rdk_daemon: ["flexiv-rdk-daemon", "--mock"]
  teleop_launch: ["ros2", "launch", "flexiv_inspire_control", "teleop_control.launch.py"]
