schema_version: 1

source:
  # Empty means recording.output_root/recording.dataset_name from site.yaml.
  dataset_root: ""
  episode: all
  manifest: ""
  mcap_files: []

output:
  format: rl100_zarr
  # Empty derives <dataset>/rl100/<profile>.zarr.
  root: ""
  episode_subdirectory: false

rl100_zarr_export:
  schema_version: 1
  profile: joint_proprio_cartesian_v1
  timeline:
    source: control/sent_command
    fps: 30.0
    resample: false
    max_period_error_fraction: 0.25
  action:
    view: sent_command
  camera_alignment: causal
  channels: {}
  segments:
    gap_threshold_s: 0.05
    min_frames: 9
