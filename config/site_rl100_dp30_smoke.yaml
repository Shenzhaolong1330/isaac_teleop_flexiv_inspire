# One-episode hardware commissioning profile for the RL-100 DP30 pipeline.
# Data written by this profile is isolated from task demonstrations.
schema_version: 1
includes:
  - hardware.yaml
  - sensors.yaml
  - recording.yaml
  - runtime.yaml
overrides:
  sampling:
    teleop_command_hz: 30.0
    camera_hz: 30.0
    policy_observation_hz: 30.0
    training_timeline_hz: 30.0
  flexiv:
    policy_control:
      require_pedal: true
  cameras:
    depth_fps: 30
    streams:
      head:
        fps: 30
      left_wrist:
        fps: 30
      right_wrist:
        fps: 30
  recording:
    dataset_name: rl100_dp30_smoke
    task_name: dp30_smoke
    episode_count: 1
    task_description: "Commissioning only: move both arms and both hands slowly through a short collision-free trajectory."
