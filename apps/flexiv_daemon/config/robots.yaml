schema_version: 1
left:
  serial: Rizon4s-063326
  expected_model: Rizon4s
  expected_active_tool: inspire_rs
  require_ft_sensor: true
  expected_software_prefix: v3.11
  required_license: RDK-Professional
right:
  serial: Rizon4s-063806
  expected_model: Rizon4s
  expected_active_tool: inspire_rs
  require_ft_sensor: true
  expected_software_prefix: v3.11
  required_license: RDK-Professional
tool_payload_config: tool_payload.yaml
control:
  target_rate_hz: 300
  default_mode: observe_only
  hardware_writes_enabled: false
  # Independent daemon ceiling. The site command profile must be at or below
  # these values; robot validate checks the two configs before startup.
  cartesian_limits:
    max_linear_velocity_m_s: 0.35
    max_angular_velocity_rad_s: 1.0
    max_linear_acceleration_m_s2: 1.0
    max_angular_acceleration_rad_s2: 2.0
ipc:
  socket_name: rdk.sock
  max_packet_bytes: 65536
ft_zero:
  confirmation_token: FLEXIV-FT-UNLOADED
  # Practical site mode: ZeroFTSensor may run with a non-zero estimated
  # external wrench. The operator is responsible for physically unloading it.
  external_contact_check_enabled: false
  # Practical reset: short windows are enough because the Flexiv primitive
  # performs the actual zeroing and the controller retains its own checks.
  sample_window_s: 0.25
  sample_rate_hz: 200.0
  operational_timeout_s: 30.0
  primitive_timeout_s: 30.0
  # Robot.Enable releases the brakes and can cause a brief unloaded rebound.
  # Keep the strict velocity limits, but require them continuously for this
  # window before executing ZeroFTSensor.
  enable_settle_timeout_s: 3.0
  enable_settle_window_s: 0.15
  max_joint_velocity_norm: 0.01
  max_tcp_velocity_norm: 0.01
  max_wrench_std_force_n: 0.5
  max_wrench_std_torque_nm: 0.05
  max_residual_force_n: 1.0
  max_residual_torque_nm: 0.1
  max_pre_external_mean_force_n: 3.0
  max_pre_external_mean_torque_nm: 0.3
  max_pre_external_peak_force_n: 5.0
  max_pre_external_peak_torque_nm: 0.5
  # Inspire angle feedback is integer 0..1000 and exhibits about 2 counts of
  # stationary quantization noise. Five counts still rejects real hand motion.
  max_hand_delta: 5.0
