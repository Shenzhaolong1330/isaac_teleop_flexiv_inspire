[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiv-inspire-policy-contracts"
version = "0.1.0"
description = "Transport-independent Flexiv/Inspire policy feature contracts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5"]

[tool.setuptools]
packages = ["policy_contracts"]

[tool.setuptools.package-dir]
"policy_contracts" = "src/flexiv_inspire_isaac/policy_contracts"
