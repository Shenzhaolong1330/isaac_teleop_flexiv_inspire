# 日常数采只改这个文件；启动命令不接收参数。
recording:
  # 输出目录为 <output_root>/<dataset_name>/raw/
  # <task_name>_episode_001_YYYYMMDD_HHMM/；同级 lerobot/ 存放转换结果。
  dataset_name: open_boxes_first_try
  # 短任务名用于新 episode 目录命名；修改它不会重命名历史数据。
  task_name: open_boxes
  episode_count: 20
  output_root: sessions
  # 写入每条 manifest，并默认作为 LeRobot/VLA 的 task prompt。
  task_description: "Use both thumbs to open the latches on both sides of the box, then remove the lid."
  camera_recording_mode: jpeg
  deviceio_mode: native
  # 训练与 replay 都使用 deviceio.mcap；关闭重复的 ROS bag 可显著省空间。
  ros_mcap_enabled: false
  # training 仅保留相机、双臂完整状态、双手/触觉和 sent_command。
  deviceio_profile: training  # training | full
  # true: 只在中踏板踩下、机械臂允许运动时写入上述训练数据。
  # 松开踏板不会结束 episode，再次踩下会继续写入同一条数据。
  record_only_while_pedal_pressed: true
  snapshot_config: true
  # One-command hardware preparation: F/T zero (or session reuse), Home, then
  # leave both hands open before recording and teleop authorization begin.
  auto_reset_before_record: true
  auto_start: true
  auto_authorize_home: true
  auto_authorize_control: true
  # Start the desktop Rerun viewer alongside robot record.  It is read-only
  # and closes its ROS subscriptions when recording stops.
  live_rerun:
    enabled: true
    viewer_port: 9876
    # Only the read-only desktop visualization is additionally downsampled.
    # MCAP keeps each producer's configured dataset rate (camera is 15 Hz).
    telemetry_hz: 5.0
    tactile_hz: 10.0
    image_hz: 10.0
    pointcloud_hz: 2.0

lerobot_export:
  schema_version: 1
  timeline:
    source: camera/head/jpeg
    # 运行时由 hardware.yaml:sampling.training_timeline_hz 覆盖。
    fps: 15.0
  high_rate_arm_samples_per_frame: 20
  action:
    view: sent_command
  channels: {}
