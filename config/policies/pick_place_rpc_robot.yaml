# Read observations from the Isaac/Flexiv hardware owner. Shadow is the
# default: predictions are validated and logged but never sent to the robot.
teleop:
  control_mode: oculus
  dual_arm: true
  oculus_config:
    ip: null
    use_gripper: true

robot:
  target: 127.0.0.1:50051
  profile_id: dual_arm_lerobot_v1
  feature_contract_info: /home/hb/isaac_teleop_flexiv_inspire/sessions/pick_place_demo/lerobot_merged/dual_arm_lerobot_v1/meta/info.json
  insecure_loopback: false
  server_ca: /home/hb/isaac_teleop_flexiv_inspire/certs/server.crt
  client_cert: ""
  client_key: ""
  connect_timeout_s: 5.0
  request_timeout_s: 0.5
  state_max_age_ms: 50.0
  hand_max_age_ms: 150.0
  image_max_age_ms: 150.0
  image_width: 424
  image_height: 240
  shadow_only: true
  shadow_log_every_n: 15
  client_id: pick-place-demo-act-v1
  action_ttl_ms: 250.0
  requested_lease_ms: 2000
  use_cameras: true
  use_gripper: true

cameras:
  left_wrist_cam_serial: ""
  right_wrist_cam_serial: ""
  head_cam_serial: ""
  width: 424
  height: 240
  capture_fps: 15
