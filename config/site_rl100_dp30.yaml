# Opt-in real-robot profile for the RL-100 2D diffusion-policy MVP.
# The default site.yaml remains unchanged until this profile is validated on hardware.
schema_version: 1
includes:
  - hardware.yaml
  - sensors.yaml
  - recording.yaml
  - runtime.yaml
overrides:
  sampling:
    teleop_command_hz: 30.0
    camera_hz: 30.0
    policy_observation_hz: 30.0
    training_timeline_hz: 30.0
  recording:
    # The 5070 collection terminal currently has no graphical DISPLAY.
    live_rerun:
      enabled: false
  flexiv:
    policy_control:
      require_pedal: true
  cameras:
    depth_fps: 30
    streams:
      head:
        fps: 30
      left_wrist:
        fps: 30
      right_wrist:
        fps: 30
