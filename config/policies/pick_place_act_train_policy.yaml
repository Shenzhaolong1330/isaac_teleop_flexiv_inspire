# ACT architecture dedicated to the 15 Hz dual-arm pick/place dataset.
# Keep architecture fields in sync with pick_place_act_inference_policy.yaml.
device: cuda
use_amp: false
n_obs_steps: 1
chunk_size: 15

normalization_mapping:
  VISUAL: MEAN_STD
  STATE: MEAN_STD
  ACTION: MEAN_STD

vision_backbone: resnet18
pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
replace_final_stride_with_dilation: false

pre_norm: false
dim_model: 512
n_heads: 8
dim_feedforward: 3200
feedforward_activation: relu
n_encoder_layers: 4
n_decoder_layers: 1

use_vae: true
latent_dim: 32
n_vae_encoder_layers: 4
kl_weight: 5
dropout: 0.05

optimizer_lr: 0.00001
optimizer_weight_decay: 0.0001
optimizer_lr_backbone: 0.00001

push_to_hub: false
pretrained_path: null
n_action_steps: 5
temporal_ensemble_coeff: null
