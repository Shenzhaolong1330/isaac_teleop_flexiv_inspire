# Validated 30 Hz RL-100 data-collection entry point.
schema_version: 1
includes:
  - hardware.yaml
  - sensors.yaml
  - recording.yaml
  - runtime.yaml
overrides:
  sampling:
    # Keep operator tracking at 60 Hz; conversion samples commands to 30 Hz.
    teleop_command_hz: 60.0
    camera_hz: 30.0
    policy_observation_hz: 30.0
    training_timeline_hz: 30.0
  recording:
    # The 5070 collection terminal currently has no graphical DISPLAY.
    live_rerun:
      enabled: false
  flexiv:
    policy_control:
      require_pedal: true
    safety:
      software_safety_limits_enabled: true
  cameras:
    depth_fps: 30
    streams:
      head:
        fps: 30
      left_wrist:
        fps: 30
      right_wrist:
        fps: 30
