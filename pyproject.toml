[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiv-inspire-isaac"
version = "0.1.0"
description = "Isolated NVIDIA Isaac Teleop bridge for the existing Flexiv dual-arm and Inspire hand stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ros = ["msgpack>=1.0"]
test = ["pytest>=7.4,<8"]

[project.scripts]
isaac-flexiv-verify = "flexiv_inspire_isaac.verify:main"
isaac-flexiv-ros2 = "flexiv_inspire_isaac.ros2_runtime:main"
isaac-flexiv-gateway = "flexiv_inspire_isaac.gateway_safe_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

