[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexiv-inspire-isaac"
version = "0.3.0"
description = "Independent Isaac Teleop, acquisition, visualization, and policy adapters for Flexiv and Inspire"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "isaac-teleop-core==0.2.0",
  "grpcio>=1.71,<2",
  "msgpack>=1,<2",
  "numpy>=2.0,<2.3",
  "protobuf>=5.29,<6",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = ["mcap>=1.2,<2", "mcap-ros2-support>=0.5,<1", "rerun-sdk>=0.24,<0.34"]
test = ["pytest>=8.4,<9"]

[project.scripts]
flexiv-inspire-camera-node = "flexiv_inspire_isaac.cameras.ros_node:main"
flexiv-inspire-camera-smoke = "flexiv_inspire_isaac.cameras.smoke:main"
flexiv-inspire-camera-verify = "flexiv_inspire_isaac.cameras.verify:main"
flexiv-inspire-camera-calibrate = "flexiv_inspire_isaac.cameras.calibration:main"
flexiv-inspire-xr-bridge = "flexiv_inspire_xr_bridge.ros_node:main"
flexiv-inspire-dftp-node = "flexiv_inspire_isaac.dftp.ros_node:main"
flexiv-inspire-dftp-read-only = "flexiv_inspire_isaac.dftp.read_only_check:main"
flexiv-inspire-dftp-calibrate-force = "flexiv_inspire_isaac.dftp.force_calibration:main"
flexiv-inspire-control-bridge = "flexiv_inspire_control.node:main"
flexiv-inspire-authorize-control = "flexiv_inspire_control.authorize_control:main"
flexiv-inspire-authorize-home = "flexiv_inspire_control.authorize_home:main"
flexiv-inspire-home = "flexiv_inspire_control.authorize_home:request_main"
flexiv-inspire-zero-ft-local = "flexiv_inspire_control.zero_ft_local:main"
flexiv-inspire-reset = "flexiv_inspire_isaac.cli:reset_main"
flexiv-inspire-teleop-input = "flexiv_inspire_control.teleop_input_node:main"
flexiv-inspire-manus-calibrate = "flexiv_inspire_control.manus_calibration:main"
flexiv-inspire-policy-server = "flexiv_inspire_isaac.policy_api.ros_adapter:main"
flexiv-inspire-lerobot-export = "flexiv_inspire_isaac.data_pipeline.lerobot_cli:main"
flexiv-inspire-data-smoke = "flexiv_inspire_isaac.data_pipeline.synthetic_smoke:main"
isaac-flexiv-episode = "flexiv_inspire_isaac.data_pipeline.episode_manager:main"
flexiv-inspire-rerun = "flexiv_inspire_isaac.rerun_viz.cli:main"
flexiv-inspire-visualize = "flexiv_inspire_isaac.rerun_viz.offline:main"
flexiv-inspire-pedal-router = "flexiv_inspire_isaac.pedal_router:main"
flexiv-inspire-episode-controller = "flexiv_inspire_isaac.episode_control:main"
flexiv-inspire-xr-raw-source = "flexiv_inspire_isaac.xr_raw_ros_source:main"
flexiv-inspire = "flexiv_inspire_isaac.cli:main"
robot = "flexiv_inspire_isaac.cli:main"
flexiv-inspire-collect = "flexiv_inspire_isaac.cli:collect_main"
flexiv-inspire-replay = "flexiv_inspire_isaac.replay:main"

[tool.setuptools]
packages = [
  "flexiv_inspire_isaac",
  "flexiv_inspire_isaac.cameras",
  "flexiv_inspire_isaac.data_pipeline",
  "flexiv_inspire_isaac.dftp",
  "flexiv_inspire_isaac.policy_api",
  "flexiv_inspire_isaac.policy_api.generated",
  "flexiv_inspire_isaac.rerun_viz",
  "flexiv_inspire_xr_bridge",
  "flexiv_inspire_control",
  "flexiv_rdk_daemon",
]

[tool.setuptools.package-dir]
"flexiv_inspire_isaac" = "apps/session_manager/src/flexiv_inspire_isaac"
"flexiv_inspire_isaac.cameras" = "ros2_ws/src/flexiv_inspire_cameras"
"flexiv_inspire_isaac.data_pipeline" = "libs/data_core/src/flexiv_inspire_isaac/data_pipeline"
"flexiv_inspire_isaac.dftp" = "ros2_ws/src/flexiv_inspire_dftp"
"flexiv_inspire_isaac.policy_api" = "apps/policy_server/src/flexiv_inspire_isaac/policy_api"
"flexiv_inspire_isaac.policy_api.generated" = "apps/policy_server/src/flexiv_inspire_isaac/policy_api/generated"
"flexiv_inspire_isaac.rerun_viz" = "ros2_ws/src/flexiv_inspire_rerun"
"flexiv_inspire_xr_bridge" = "ros2_ws/src/flexiv_inspire_xr_bridge/flexiv_inspire_xr_bridge"
"flexiv_inspire_control" = "ros2_ws/src/flexiv_inspire_control/flexiv_inspire_control"
"flexiv_rdk_daemon" = "apps/flexiv_daemon/src/flexiv_rdk_daemon"

[tool.setuptools.package-data]
"flexiv_inspire_isaac.cameras" = ["*.yaml", "launch/*.py"]
"flexiv_inspire_isaac.dftp" = ["*.yaml", "launch/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing -p no:launch_ros"
